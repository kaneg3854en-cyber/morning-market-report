<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="朝の経済分析">
<link rel="manifest" href="manifest.json">
<title>朝の経済分析</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f5f7fa;color:#0b2a52;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100vh;display:flex;justify-content:center}.wrap{width:100%;max-width:1600px;padding:10px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px 12px}.title{font-weight:800;font-size:20px}.date{font-size:13px;color:#607086}.report{background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(20,45,80,.10);overflow:hidden}.report img{display:block;width:100%;height:auto}.hint{font-size:11px;color:#718096;text-align:center;padding:8px 0 4px}@media(min-width:900px){.wrap{padding:16px}.title{font-size:24px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top"><div class="title">🌎 朝の経済分析</div><div class="date">最新レポート</div></header>
  <section class="report"><img src="report.png" alt="現在の世界情勢とマーケット分析"></section>
  <div class="hint">最新画像が report.png に更新されると、このページにも反映されます。</div>
</main>
</body>
</html>
